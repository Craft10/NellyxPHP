[www]
user = www-data
group = www-data

; Escucha en localhost, Nginx corre en el mismo contenedor
listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Muestra el output de los workers en los logs del contenedor
catch_workers_output = yes
decorate_workers_output = no

; No limpiar variables de entorno (útil para configs por env vars, .env, etc.)
clear_env = no

; Timeouts razonables
request_terminate_timeout = 120s
